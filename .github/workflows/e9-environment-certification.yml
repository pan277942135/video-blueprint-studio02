name: E9 Environment Certification

on:
  pull_request:
    branches: [ main, master ]
    paths:
      - "packages/pipeline_core/environment_photometry.py"
      - "packages/pipeline_core/e9_media_pipeline.py"
      - "packages/blueprint_schema/environment_contract.py"
      - "packages/blueprint_schema/composite_validator.py"
      - "scripts/certify_environment_e9.py"
      - "scripts/run_pipeline_job.py"
      - "tests/unit/test_e9_environment.py"
      - ".github/workflows/e9-environment-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  environment-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install certified E2/E4 runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install "numpy==1.26.4" "opencv-python==4.10.0.84"
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.1.0 torchvision==0.16.0
          pip install "mmengine>=0.7.1,<1.0.0"
          pip install "mmcv==2.1.0" -f https://download.openmmlab.com/mmcv/dist/cpu/torch2.1/index.html
          pip install "mmdet==3.3.0"
          pip install "pydantic>=2.0.0" "jsonschema>=4.18.0" "scenedetect>=0.6.7,<0.7"
          pip install -e . --no-deps

      - name: Resolve fixed mmdet configs
        run: |
          mkdir -p .cert
          python - <<'PY'
          import pathlib, mmdet
          root = pathlib.Path(mmdet.__file__).resolve().parent / '.mim' / 'configs' / 'rtmdet'
          detector = root / 'rtmdet_tiny_8xb32-300e_coco.py'
          mask = root / 'rtmdet-ins_tiny_8xb32-300e_coco.py'
          for path in (detector, mask):
              if not path.is_file(): raise SystemExit(f'config not found: {path}')
          pathlib.Path('.cert/det_config.txt').write_text(str(detector), encoding='utf-8')
          pathlib.Path('.cert/mask_config.txt').write_text(str(mask), encoding='utf-8')
          PY

      - name: Download and verify certified checkpoints
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o .cert/rtmdet_tiny.pth https://download.openmmlab.com/mmdetection/v3.0/rtmdet/rtmdet_tiny_8xb32-300e_coco/rtmdet_tiny_8xb32-300e_coco_20220902_112414-78e30dcc.pth
          curl --fail --location --retry 3 -o .cert/rtmdet_ins_tiny.pth https://download.openmmlab.com/mmdetection/v3.0/rtmdet/rtmdet-ins_tiny_8xb32-300e_coco/rtmdet-ins_tiny_8xb32-300e_coco_20221130_151727-ec670f7e.pth
          sha256sum .cert/rtmdet_tiny.pth | tee .cert/detector.sha256
          sha256sum .cert/rtmdet_ins_tiny.pth | tee .cert/mask.sha256
          test "$(cut -d' ' -f1 .cert/detector.sha256)" = "78e30dcce0c6f594eaff0d6977b84b4103688b4aff0ad1aa16008a8cc854a7fb"
          test "$(cut -d' ' -f1 .cert/mask.sha256)" = "ec670f7ee9e20bd7931e15f15b7016f7fe531baaab81f2e6153382d046111885"

      - name: Build deterministic real-human brightness-ramp video
        run: |
          curl --fail --location --retry 3 -o .cert/person.jpg https://raw.githubusercontent.com/open-mmlab/mmpose/main/tests/data/coco/000000197388.jpg
          python - <<'PY'
          import json, pathlib, cv2, numpy as np
          image = cv2.imread('.cert/person.jpg')
          if image is None: raise SystemExit('could not decode official human sample')
          gains = np.asarray([0.82, 0.86, 0.90, 0.94, 0.98, 1.02, 1.06, 1.10], dtype=np.float32)
          out = pathlib.Path('.cert/frames'); out.mkdir(parents=True, exist_ok=True)
          for idx, gain in enumerate(gains):
              frame = np.clip(image.astype(np.float32) * float(gain), 0, 255).astype(np.uint8)
              if not cv2.imwrite(str(out / f'{idx:03d}.png'), frame): raise SystemExit('failed to write frame')
          pathlib.Path('.cert/stimulus.json').write_text(
              json.dumps({'background_gain': gains.tolist(), 'semantics': 'global photometric brightness ramp; no scene semantics'}, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          ffmpeg -hide_banner -loglevel error -framerate 4 -i .cert/frames/%03d.png -vf "pad=ceil(iw/2)*2:ceil(ih/2)*2" -c:v libx264 -pix_fmt yuv420p -movflags +faststart .cert/environment_smoke.mp4

      - name: Run E2-to-E9 environment certification
        run: |
          set -o pipefail
          python scripts/certify_environment_e9.py \
            --video .cert/environment_smoke.mp4 \
            --det-config "$(cat .cert/det_config.txt)" --det-checkpoint .cert/rtmdet_tiny.pth \
            --mask-config "$(cat .cert/mask_config.txt)" --mask-checkpoint .cert/rtmdet_ins_tiny.pth \
            --stimulus .cert/stimulus.json \
            --output .cert/e9_environment_certification.json 2>&1 | tee .cert/e9_environment_certification.log

      - name: Show certification evidence
        if: always()
        run: |
          cat .cert/stimulus.json || true
          cat .cert/e9_environment_certification.log || true
          cat .cert/e9_environment_certification.json || true

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e9-environment-certification
          path: |
            .cert/detector.sha256
            .cert/mask.sha256
            .cert/stimulus.json
            .cert/e9_environment_certification.log
            .cert/e9_environment_certification.json
          if-no-files-found: warn
