name: Epic E1 CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  e1-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Contract Validation
        run: python scripts/validate_contracts.py

      - name: TypeScript type check
        run: npm run lint

      - name: Build applet runtime
        run: npm run build

      - name: Start applet runtime for true HTTP E2E
        run: |
          NODE_ENV=production npm start > /tmp/vbs-node.log 2>&1 &
          echo $! > /tmp/vbs-node.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/v1/videos >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vbs-node.log
          exit 1

      - name: Pytest including runtime upload-to-bundle E2E
        run: python -m pytest tests/ -v

      - name: Ruff Lint
        run: ruff check .

      - name: Mypy Type Check
        run: mypy apps packages

      - name: Runtime log on failure
        if: failure()
        run: cat /tmp/vbs-node.log || true
