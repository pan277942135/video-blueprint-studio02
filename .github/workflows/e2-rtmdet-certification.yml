name: E2 RTMDet Certification

on:
  pull_request:
    branches: [ main, master ]
    paths:
      - "packages/pipeline_core/rtmdet_backend.py"
      - "packages/pipeline_core/person_tracking.py"
      - "packages/pipeline_core/real_media_pipeline.py"
      - "scripts/certify_rtmdet_e2.py"
      - "docs/model-approvals/rtmdet_tiny_8xb32-300e_coco.yml"
      - ".github/workflows/e2-rtmdet-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rtmdet-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install project and OpenMMLab runtime
        run: |
          python -m pip install --upgrade pip
          # Torch 2.1/MMCV 2.1 wheels were built against the NumPy 1.x ABI.
          # Keep NumPy below 2 and avoid the OpenCV 5 dependency path that can
          # otherwise pull NumPy 2 back into the certification environment.
          pip install "numpy==1.26.4" "opencv-python==4.10.0.84"
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.1.0 torchvision==0.16.0
          pip install "mmengine>=0.7.1,<1.0.0"
          pip install "mmcv==2.1.0" -f https://download.openmmlab.com/mmcv/dist/cpu/torch2.1/index.html
          pip install "mmdet==3.3.0"
          # Install only the project dependencies exercised by the real-media
          # certification path. The editable package itself stays --no-deps so
          # its broad OpenCV requirement cannot perturb the certified ABI stack.
          pip install "jsonschema>=4.18.0" "scenedetect>=0.6.7,<0.7"
          pip install -e . --no-deps
          python - <<'PY'
          import jsonschema
          import numpy
          import scenedetect
          assert numpy.__version__ == "1.26.4", numpy.__version__
          print("numpy", numpy.__version__)
          print("jsonschema", jsonschema.__version__)
          print("scenedetect", scenedetect.__version__)
          PY

      - name: Resolve installed RTMDet Tiny config
        run: |
          mkdir -p .cert
          python - <<'PY' > .cert/config_path.txt
          import pathlib
          import mmdet
          path = pathlib.Path(mmdet.__file__).resolve().parent / ".mim" / "configs" / "rtmdet" / "rtmdet_tiny_8xb32-300e_coco.py"
          if not path.is_file():
              raise SystemExit(f"MMDetection RTMDet Tiny config not found: {path}")
          print(path)
          PY
          cat .cert/config_path.txt

      - name: Download and verify approved OpenMMLab checkpoint
        run: |
          EXPECTED_SHA256="78e30dcce0c6f594eaff0d6977b84b4103688b4aff0ad1aa16008a8cc854a7fb"
          curl --fail --location --retry 3 --output .cert/rtmdet_tiny.pth \
            https://download.openmmlab.com/mmdetection/v3.0/rtmdet/rtmdet_tiny_8xb32-300e_coco/rtmdet_tiny_8xb32-300e_coco_20220902_112414-78e30dcc.pth
          sha256sum .cert/rtmdet_tiny.pth | tee .cert/weights.sha256
          test "$(cut -d' ' -f1 .cert/weights.sha256)" = "$EXPECTED_SHA256"

      - name: Download official OpenMMLab human sample
        run: |
          # MMDetection's generic demo image is dominated by cars/benches and is
          # not a reliable person-class smoke input. MMPose's official COCO human
          # sample is explicitly used by OpenMMLab for RTMDet->human-pose demos.
          curl --fail --location --retry 3 --output .cert/person.jpg \
            https://raw.githubusercontent.com/open-mmlab/mmpose/main/tests/data/coco/000000197388.jpg
          test -s .cert/person.jpg

      - name: Validate approved RTMDet person signal
        run: |
          CONFIG_PATH="$(cat .cert/config_path.txt)"
          python - <<'PY'
          import os
          import cv2
          from mmdet.apis import inference_detector, init_detector

          config_path = open('.cert/config_path.txt', encoding='utf-8').read().strip()
          model = init_detector(config_path, '.cert/rtmdet_tiny.pth', device='cpu')
          image = cv2.imread('.cert/person.jpg')
          if image is None:
              raise SystemExit('could not decode official OpenMMLab human sample')
          result = inference_detector(model, image)
          instances = result.pred_instances
          labels = instances.labels.detach().cpu().numpy()
          scores = instances.scores.detach().cpu().numpy()
          person_scores = [float(score) for label, score in zip(labels, scores) if int(label) == 0]
          max_person_score = max(person_scores, default=0.0)
          print(f'person_candidates={len(person_scores)} max_person_score={max_person_score:.6f}')
          if max_person_score < 0.30:
              raise SystemExit(f'approved RTMDet person signal below certification threshold: {max_person_score:.6f}')
          PY

      - name: Build a short real-media video from the human sample
        run: |
          ffmpeg -hide_banner -loglevel error -loop 1 -i .cert/person.jpg -t 1.5 -r 4 \
            -vf "pad=ceil(iw/2)*2:ceil(ih/2)*2" \
            -c:v libx264 -pix_fmt yuv420p -movflags +faststart .cert/person_smoke.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 .cert/person_smoke.mp4

      - name: Run approved RTMDet Tiny end-to-end certification
        run: |
          CONFIG_PATH="$(cat .cert/config_path.txt)"
          python scripts/certify_rtmdet_e2.py \
            --video .cert/person_smoke.mp4 \
            --config "$CONFIG_PATH" \
            --checkpoint .cert/rtmdet_tiny.pth \
            --sha-prefix 78e30dcc \
            --expected-sha256 78e30dcce0c6f594eaff0d6977b84b4103688b4aff0ad1aa16008a8cc854a7fb \
            --output .cert/e2_rtmdet_certification.json

      - name: Show certification result
        if: always()
        run: |
          cat .cert/weights.sha256 || true
          cat .cert/e2_rtmdet_certification.json || true
