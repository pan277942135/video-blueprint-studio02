name: E3.2 MediaPipe Certification

on:
  pull_request:
    branches: [ main, master ]
    paths:
      - "packages/pipeline_core/face_hand_refinement.py"
      - "packages/pipeline_core/mediapipe_face_hand_backend.py"
      - "packages/pipeline_core/real_media_pipeline.py"
      - "scripts/certify_mediapipe_e3_2.py"
      - "docs/model-approvals/mediapipe-face-hand-landmarker.yml"
      - ".github/workflows/e3-2-mediapipe-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mediapipe-e3-2-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install approved MediaPipe runtime and project
        run: |
          python -m pip install --upgrade pip
          pip install "mediapipe==0.10.35"
          pip install -e . --no-deps
          pip install "jsonschema>=4.18.0" "scenedetect>=0.6.7,<0.7" "opencv-python-headless>=4.10.0"
          python - <<'PY'
          import mediapipe as mp
          print("mediapipe", mp.__version__)
          assert mp.__version__ == "0.10.35", mp.__version__
          PY

      - name: Download and verify approved FaceLandmarker task
        run: |
          mkdir -p .cert
          EXPECTED_SHA256="64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff"
          curl --fail --location --retry 3 --output .cert/face_landmarker.task \
            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task"
          sha256sum .cert/face_landmarker.task | tee .cert/face_task.sha256
          test "$(cut -d' ' -f1 .cert/face_task.sha256)" = "$EXPECTED_SHA256"

      - name: Download and verify approved HandLandmarker task
        run: |
          EXPECTED_SHA256="fbc2a30080c3c557093b5ddfc334698132eb341044ccee322ccf8bcf3607cde1"
          curl --fail --location --retry 3 --output .cert/hand_landmarker.task \
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task"
          sha256sum .cert/hand_landmarker.task | tee .cert/hand_task.sha256
          test "$(cut -d' ' -f1 .cert/hand_task.sha256)" = "$EXPECTED_SHA256"

      - name: Download pinned MediaPipe certification images
        run: |
          curl --fail --location --retry 3 --output .cert/portrait.jpg \
            "https://storage.googleapis.com/mediapipe-assets/portrait.jpg?generation=1674261630039907"
          curl --fail --location --retry 3 --output .cert/thumb_up.jpg \
            "https://storage.googleapis.com/mediapipe-assets/thumb_up.jpg?generation=1662650667349746"
          echo "a6f11efaa834706db23f275b6115058fa87fc7f14362681e6abe14e82749de3e  .cert/portrait.jpg" | sha256sum --check
          echo "5d673c081ab13b8a1812269ff57047066f9c33c07db5f4178089e8cb3fdc0291  .cert/thumb_up.jpg" | sha256sum --check

      - name: Build deterministic face-plus-hand certification video
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -i .cert/portrait.jpg -i .cert/thumb_up.jpg \
            -filter_complex "[0:v]scale=-2:512[face];[1:v]scale=-2:512[hand];[face][hand]hstack=inputs=2[canvas]" \
            -map "[canvas]" -frames:v 1 .cert/face_hand_canvas.png
          ffmpeg -hide_banner -loglevel error -y -loop 1 -i .cert/face_hand_canvas.png \
            -t 1.5 -r 4 -vf "pad=ceil(iw/2)*2:ceil(ih/2)*2" \
            -c:v libx264 -pix_fmt yuv420p -movflags +faststart .cert/face_hand_smoke.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames \
            -of default=noprint_wrappers=1 .cert/face_hand_smoke.mp4

      - name: Run real E3.2 MediaPipe VIDEO-mode certification
        run: |
          python scripts/certify_mediapipe_e3_2.py \
            --video .cert/face_hand_smoke.mp4 \
            --face-task .cert/face_landmarker.task \
            --hand-task .cert/hand_landmarker.task \
            --output .cert/e3_2_mediapipe_certification.json

      - name: Show certification evidence
        if: always()
        run: |
          cat .cert/face_task.sha256 || true
          cat .cert/hand_task.sha256 || true
          cat .cert/e3_2_mediapipe_certification.json || true

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e3-2-mediapipe-certification
          path: |
            .cert/face_task.sha256
            .cert/hand_task.sha256
            .cert/e3_2_mediapipe_certification.json
          if-no-files-found: warn
