name: E3 RTMPose Certification

on:
  pull_request:
    branches: [ main, master ]
    paths:
      - "packages/pipeline_core/pose_estimation.py"
      - "packages/pipeline_core/rtmpose_backend.py"
      - "packages/pipeline_core/real_media_pipeline.py"
      - "scripts/certify_rtmpose_e3.py"
      - "docs/model-approvals/rtmpose-t_8xb256-420e_coco-256x192.yml"
      - ".github/workflows/e3-rtmpose-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rtmpose-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install project and OpenMMLab pose runtime
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==1.26.4" "opencv-python==4.10.0.84"
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.1.0 torchvision==0.16.0
          pip install "mmengine>=0.7.1,<1.0.0"
          pip install "mmcv==2.1.0" -f https://download.openmmlab.com/mmcv/dist/cpu/torch2.1/index.html
          pip install "mmdet==3.3.0"
          pip install "mmpose==1.3.2" --no-deps
          # RTMPose COCO-17 inference does not import MMPose's legacy SMPL/chumpy path.
          # Keep the certification environment to the runtime modules actually exercised.
          pip install json_tricks matplotlib munkres pillow scipy "xtcocotools>=1.12"
          pip install "jsonschema>=4.18.0" "scenedetect>=0.6.7,<0.7"
          pip install -e . --no-deps
          python - <<'PY'
          import mmcv
          import mmdet
          import mmengine
          import mmpose
          import numpy
          print("numpy", numpy.__version__)
          print("mmcv", mmcv.__version__)
          print("mmengine", mmengine.__version__)
          print("mmdet", mmdet.__version__)
          print("mmpose", mmpose.__version__)
          assert numpy.__version__ == "1.26.4", numpy.__version__
          assert mmpose.__version__ == "1.3.2", mmpose.__version__
          PY

      - name: Resolve installed RTMDet and RTMPose configs
        run: |
          mkdir -p .cert
          python - <<'PY'
          import pathlib
          import mmdet
          import mmpose

          rtmdet = (
              pathlib.Path(mmdet.__file__).resolve().parent
              / ".mim"
              / "configs"
              / "rtmdet"
              / "rtmdet_tiny_8xb32-300e_coco.py"
          )
          rtmpose = (
              pathlib.Path(mmpose.__file__).resolve().parent
              / ".mim"
              / "configs"
              / "body_2d_keypoint"
              / "rtmpose"
              / "coco"
              / "rtmpose-t_8xb256-420e_coco-256x192.py"
          )
          if not rtmdet.is_file():
              raise SystemExit(f"MMDetection RTMDet Tiny config not found: {rtmdet}")
          if not rtmpose.is_file():
              raise SystemExit(f"MMPose RTMPose Tiny config not found: {rtmpose}")
          pathlib.Path(".cert/rtmdet_config_path.txt").write_text(str(rtmdet) + "\n", encoding="utf-8")
          pathlib.Path(".cert/rtmpose_config_path.txt").write_text(str(rtmpose) + "\n", encoding="utf-8")
          print("rtmdet_config", rtmdet)
          print("rtmpose_config", rtmpose)
          PY

      - name: Download and verify approved RTMDet checkpoint
        run: |
          EXPECTED_SHA256="78e30dcce0c6f594eaff0d6977b84b4103688b4aff0ad1aa16008a8cc854a7fb"
          curl --fail --location --retry 3 --output .cert/rtmdet_tiny.pth \
            https://download.openmmlab.com/mmdetection/v3.0/rtmdet/rtmdet_tiny_8xb32-300e_coco/rtmdet_tiny_8xb32-300e_coco_20220902_112414-78e30dcc.pth
          sha256sum .cert/rtmdet_tiny.pth | tee .cert/rtmdet_weights.sha256
          test "$(cut -d' ' -f1 .cert/rtmdet_weights.sha256)" = "$EXPECTED_SHA256"

      - name: Download and verify approved RTMPose Tiny checkpoint
        run: |
          EXPECTED_SHA256="77ffc7e802acf10951c353e8bc68b4f05218121177ceaea163aa124436ba6fb7"
          curl --fail --location --retry 3 --output .cert/rtmpose_tiny.pth \
            https://download.openmmlab.com/mmpose/v1/projects/rtmposev1/rtmpose-tiny_simcc-coco_pt-aic-coco_420e-256x192-e613ba3f_20230127.pth
          sha256sum .cert/rtmpose_tiny.pth | tee .cert/rtmpose_weights.sha256
          test "$(cut -d' ' -f1 .cert/rtmpose_weights.sha256)" = "$EXPECTED_SHA256"
          echo "RTMPOSE_FULL_SHA256=$EXPECTED_SHA256" | tee .cert/rtmpose_full_sha256.env

      - name: Download official OpenMMLab human sample
        run: |
          curl --fail --location --retry 3 --output .cert/person.jpg \
            https://raw.githubusercontent.com/open-mmlab/mmpose/main/tests/data/coco/000000197388.jpg
          test -s .cert/person.jpg

      - name: Validate approved RTMDet-to-RTMPose signal directly
        run: |
          python - <<'PY'
          import cv2
          import numpy as np
          from mmdet.apis import inference_detector, init_detector
          from mmpose.apis import inference_topdown, init_model

          rtmdet_config = open('.cert/rtmdet_config_path.txt', encoding='utf-8').read().strip()
          rtmpose_config = open('.cert/rtmpose_config_path.txt', encoding='utf-8').read().strip()
          detector = init_detector(rtmdet_config, '.cert/rtmdet_tiny.pth', device='cpu')
          pose_model = init_model(rtmpose_config, '.cert/rtmpose_tiny.pth', device='cpu')

          image = cv2.imread('.cert/person.jpg')
          if image is None:
              raise SystemExit('could not decode official OpenMMLab human sample')

          detection = inference_detector(detector, image)
          instances = detection.pred_instances
          labels = instances.labels.detach().cpu().numpy()
          scores = instances.scores.detach().cpu().numpy()
          bboxes = instances.bboxes.detach().cpu().numpy()
          person_indices = np.where((labels == 0) & (scores >= 0.30))[0]
          if person_indices.size == 0:
              raise SystemExit('approved RTMDet produced no person bbox >= 0.30 for RTMPose certification')
          best_index = int(person_indices[np.argmax(scores[person_indices])])
          person_bbox = np.asarray([bboxes[best_index]], dtype=np.float32)
          detector_score = float(scores[best_index])

          result = inference_topdown(pose_model, image, bboxes=person_bbox)
          if len(result) != 1:
              raise SystemExit(f'expected one top-down pose result, got {len(result)}')
          pose_scores = np.asarray(result[0].pred_instances.keypoint_scores, dtype=np.float32).reshape(-1)
          if pose_scores.shape != (17,):
              raise SystemExit(f'expected COCO-17 confidence, got {pose_scores.shape}')
          mean_score = float(pose_scores.mean())
          min_score = float(pose_scores.min())
          print(
              f'person_score={detector_score:.6f} keypoints=17 '
              f'mean_score={mean_score:.6f} min_score={min_score:.6f} '
              f'bbox={person_bbox.reshape(-1).tolist()}'
          )
          if mean_score < 0.30:
              raise SystemExit(f'approved RTMPose signal below certification threshold: {mean_score:.6f}')
          PY

      - name: Build a short real-media video from the human sample
        run: |
          ffmpeg -hide_banner -loglevel error -loop 1 -i .cert/person.jpg -t 1.5 -r 4 \
            -vf "pad=ceil(iw/2)*2:ceil(ih/2)*2" \
            -c:v libx264 -pix_fmt yuv420p -movflags +faststart .cert/person_smoke.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 .cert/person_smoke.mp4

      - name: Run approved RTMPose Tiny end-to-end certification
        run: |
          RTMDET_CONFIG="$(cat .cert/rtmdet_config_path.txt)"
          RTMPOSE_CONFIG="$(cat .cert/rtmpose_config_path.txt)"
          python scripts/certify_rtmpose_e3.py \
            --video .cert/person_smoke.mp4 \
            --rtmdet-config "$RTMDET_CONFIG" \
            --rtmdet-checkpoint .cert/rtmdet_tiny.pth \
            --rtmpose-config "$RTMPOSE_CONFIG" \
            --rtmpose-checkpoint .cert/rtmpose_tiny.pth \
            --expected-rtmpose-sha256 77ffc7e802acf10951c353e8bc68b4f05218121177ceaea163aa124436ba6fb7 \
            --output .cert/e3_rtmpose_certification.json

      - name: Show certification result
        if: always()
        run: |
          cat .cert/rtmdet_weights.sha256 || true
          cat .cert/rtmpose_weights.sha256 || true
          cat .cert/rtmpose_full_sha256.env || true
          cat .cert/e3_rtmpose_certification.json || true
