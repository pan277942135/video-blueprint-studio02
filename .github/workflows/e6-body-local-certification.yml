name: E6 Body Local Frame Certification

on:
  pull_request:
    branches: [ main, master ]
    paths:
      - "packages/pipeline_core/body_local_frame.py"
      - "packages/pipeline_core/e6_media_pipeline.py"
      - "packages/blueprint_schema/body_local_contract.py"
      - "packages/blueprint_schema/composite_validator.py"
      - "scripts/certify_body_local_e6.py"
      - "scripts/run_pipeline_job.py"
      - "tests/unit/test_e6_body_local_frame.py"
      - "tests/unit/test_e6_body_local_contract.py"
      - "tests/integration/test_e6_body_local_pipeline.py"
      - ".github/workflows/e6-body-local-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  body-local-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and certified E2/E3/E4 runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install "numpy==1.26.4" "opencv-python==4.10.0.84"
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.1.0 torchvision==0.16.0
          pip install "mmengine>=0.7.1,<1.0.0"
          pip install "mmcv==2.1.0" -f https://download.openmmlab.com/mmcv/dist/cpu/torch2.1/index.html
          pip install "mmdet==3.3.0"
          pip install "mmpose==1.3.2" --no-deps
          # Match the already-certified E3 RTMPose runtime exactly.
          pip install json_tricks matplotlib munkres pillow scipy "xtcocotools>=1.12"
          pip install "pydantic>=2.0.0" "jsonschema>=4.18.0" "scenedetect>=0.6.7,<0.7"
          pip install -e . --no-deps
          python - <<'PY'
          import mmcv
          import mmdet
          import mmengine
          import mmpose
          import numpy
          print("numpy", numpy.__version__)
          print("mmcv", mmcv.__version__)
          print("mmengine", mmengine.__version__)
          print("mmdet", mmdet.__version__)
          print("mmpose", mmpose.__version__)
          assert numpy.__version__ == "1.26.4", numpy.__version__
          assert mmpose.__version__ == "1.3.2", mmpose.__version__
          PY

      - name: Resolve fixed OpenMMLab configs
        run: |
          mkdir -p .cert
          python - <<'PY'
          import pathlib
          import mmdet
          import mmpose
          det_root = pathlib.Path(mmdet.__file__).resolve().parent / '.mim' / 'configs' / 'rtmdet'
          detector = det_root / 'rtmdet_tiny_8xb32-300e_coco.py'
          mask = det_root / 'rtmdet-ins_tiny_8xb32-300e_coco.py'
          pose = (
              pathlib.Path(mmpose.__file__).resolve().parent
              / '.mim' / 'configs' / 'body_2d_keypoint' / 'rtmpose' / 'coco'
              / 'rtmpose-t_8xb256-420e_coco-256x192.py'
          )
          for path in (detector, mask, pose):
              if not path.is_file():
                  raise SystemExit(f'config not found: {path}')
          pathlib.Path('.cert/det_config.txt').write_text(str(detector), encoding='utf-8')
          pathlib.Path('.cert/mask_config.txt').write_text(str(mask), encoding='utf-8')
          pathlib.Path('.cert/pose_config.txt').write_text(str(pose), encoding='utf-8')
          PY

      - name: Download and verify certified checkpoints
        run: |
          set -euo pipefail
          DET_SHA=78e30dcce0c6f594eaff0d6977b84b4103688b4aff0ad1aa16008a8cc854a7fb
          POSE_SHA=77ffc7e802acf10951c353e8bc68b4f05218121177ceaea163aa124436ba6fb7
          MASK_SHA=ec670f7ee9e20bd7931e15f15b7016f7fe531baaab81f2e6153382d046111885
          curl --fail --location --retry 3 -o .cert/rtmdet_tiny.pth \
            https://download.openmmlab.com/mmdetection/v3.0/rtmdet/rtmdet_tiny_8xb32-300e_coco/rtmdet_tiny_8xb32-300e_coco_20220902_112414-78e30dcc.pth
          curl --fail --location --retry 3 -o .cert/rtmpose_tiny.pth \
            https://download.openmmlab.com/mmpose/v1/projects/rtmposev1/rtmpose-tiny_simcc-coco_pt-aic-coco_420e-256x192-e613ba3f_20230127.pth
          curl --fail --location --retry 3 -o .cert/rtmdet_ins_tiny.pth \
            https://download.openmmlab.com/mmdetection/v3.0/rtmdet/rtmdet-ins_tiny_8xb32-300e_coco/rtmdet-ins_tiny_8xb32-300e_coco_20221130_151727-ec670f7e.pth
          sha256sum .cert/rtmdet_tiny.pth | tee .cert/detector.sha256
          sha256sum .cert/rtmpose_tiny.pth | tee .cert/pose.sha256
          sha256sum .cert/rtmdet_ins_tiny.pth | tee .cert/mask.sha256
          test "$(cut -d' ' -f1 .cert/detector.sha256)" = "$DET_SHA"
          test "$(cut -d' ' -f1 .cert/pose.sha256)" = "$POSE_SHA"
          test "$(cut -d' ' -f1 .cert/mask.sha256)" = "$MASK_SHA"

      - name: Build deterministic translated real-human video
        run: |
          curl --fail --location --retry 3 -o .cert/person.jpg \
            https://raw.githubusercontent.com/open-mmlab/mmpose/main/tests/data/coco/000000197388.jpg
          python - <<'PY'
          import pathlib
          import cv2
          import numpy as np
          image = cv2.imread('.cert/person.jpg')
          if image is None:
              raise SystemExit('could not decode official human sample')
          height, width = image.shape[:2]
          textured = image.copy()
          for y in range(12, height, 24):
              for x in range(12, width, 24):
                  cv2.circle(textured, (x, y), 1, (180, 180, 180), -1)
          out = pathlib.Path('.cert/frames')
          out.mkdir(parents=True, exist_ok=True)
          for idx in range(8):
              matrix = np.asarray([[1.0, 0.0, idx * 1.0], [0.0, 1.0, idx * 0.5]], dtype=np.float32)
              frame = cv2.warpAffine(textured, matrix, (width, height), borderMode=cv2.BORDER_REPLICATE)
              if not cv2.imwrite(str(out / f'{idx:03d}.png'), frame):
                  raise SystemExit('failed to write certification frame')
          PY
          ffmpeg -hide_banner -loglevel error -framerate 4 -i .cert/frames/%03d.png \
            -vf "pad=ceil(iw/2)*2:ceil(ih/2)*2" -c:v libx264 -pix_fmt yuv420p \
            -movflags +faststart .cert/body_local_smoke.mp4

      - name: Run E2-to-E6 end-to-end certification
        run: |
          set -o pipefail
          python scripts/certify_body_local_e6.py \
            --video .cert/body_local_smoke.mp4 \
            --det-config "$(cat .cert/det_config.txt)" \
            --det-checkpoint .cert/rtmdet_tiny.pth \
            --pose-config "$(cat .cert/pose_config.txt)" \
            --pose-checkpoint .cert/rtmpose_tiny.pth \
            --mask-config "$(cat .cert/mask_config.txt)" \
            --mask-checkpoint .cert/rtmdet_ins_tiny.pth \
            --output .cert/e6_body_local_certification.json \
            2>&1 | tee .cert/e6_body_local_certification.log

      - name: Show certification evidence
        if: always()
        run: |
          cat .cert/detector.sha256 || true
          cat .cert/pose.sha256 || true
          cat .cert/mask.sha256 || true
          cat .cert/e6_body_local_certification.log || true
          cat .cert/e6_body_local_certification.json || true

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e6-body-local-certification
          path: |
            .cert/detector.sha256
            .cert/pose.sha256
            .cert/mask.sha256
            .cert/e6_body_local_certification.log
            .cert/e6_body_local_certification.json
          if-no-files-found: warn
