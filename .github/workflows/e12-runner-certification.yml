name: E12 Self-Bootstrapping Runner Certification

on:
  pull_request:
    branches: [ main, master ]
    paths:
      - "packages/pipeline_core/e12_runtime.py"
      - "packages/pipeline_core/real_video_acceptance.py"
      - "packages/pipeline_core/production_media_pipeline.py"
      - "packages/pipeline_core/mediapipe_face_hand_backend.py"
      - "scripts/run_real_video_e12.py"
      - "scripts/build_e8_cert_stimulus.py"
      - ".github/workflows/e12-runner-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-bootstrapping-runner-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install certified E2-E12 runtime dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgles2 libgl1
          python -m pip install --upgrade pip
          pip install "numpy==1.26.4" "opencv-python==4.10.0.84"
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.1.0 torchvision==0.16.0
          pip install "mmengine>=0.7.1,<1.0.0"
          pip install "mmcv==2.1.0" -f https://download.openmmlab.com/mmcv/dist/cpu/torch2.1/index.html
          pip install "mmdet==3.3.0"
          pip install "mmpose==1.3.2" --no-deps
          pip install json_tricks matplotlib munkres pillow scipy "xtcocotools>=1.12"
          pip install "mediapipe==0.10.35"
          pip install "pydantic>=2.0.0" "jsonschema>=4.18.0" "scenedetect>=0.6.7,<0.7"
          pip install -e . --no-deps
          python - <<'PY'
          import mediapipe as mp
          import mmdet
          import mmpose
          import numpy as np
          print("mediapipe", mp.__version__)
          print("mmdet", mmdet.__version__)
          print("mmpose", mmpose.__version__)
          print("numpy", np.__version__)
          assert mp.__version__ == "0.10.35"
          assert mmdet.__version__ == "3.3.0"
          assert mmpose.__version__ == "1.3.2"
          assert np.__version__ == "1.26.4"
          PY

      - name: Prepare independent stimulus assets
        run: |
          set -euo pipefail
          mkdir -p .cert/stimulus_assets .cert/frames
          python - <<'PY'
          import pathlib
          import mmdet
          import mmpose

          det_root = pathlib.Path(mmdet.__file__).resolve().parent / '.mim' / 'configs' / 'rtmdet'
          detector = det_root / 'rtmdet_tiny_8xb32-300e_coco.py'
          pose = pathlib.Path(mmpose.__file__).resolve().parent / '.mim' / 'configs' / 'body_2d_keypoint' / 'rtmpose' / 'coco' / 'rtmpose-t_8xb256-420e_coco-256x192.py'
          for path in (detector, pose):
              if not path.is_file():
                  raise SystemExit(f'config not found: {path}')
          pathlib.Path('.cert/det_config.txt').write_text(str(detector), encoding='utf-8')
          pathlib.Path('.cert/pose_config.txt').write_text(str(pose), encoding='utf-8')
          PY
          curl --fail --location --retry 3 -o .cert/stimulus_assets/person.jpg \
            https://raw.githubusercontent.com/open-mmlab/mmpose/main/tests/data/coco/000000197388.jpg
          curl --fail --location --retry 3 -o .cert/stimulus_assets/rtmdet_tiny.pth \
            https://download.openmmlab.com/mmdetection/v3.0/rtmdet/rtmdet_tiny_8xb32-300e_coco/rtmdet_tiny_8xb32-300e_coco_20220902_112414-78e30dcc.pth
          curl --fail --location --retry 3 -o .cert/stimulus_assets/rtmpose_tiny.pth \
            https://download.openmmlab.com/mmpose/v1/projects/rtmposev1/rtmpose-tiny_simcc-coco_pt-aic-coco_420e-256x192-e613ba3f_20230127.pth
          echo "78e30dcce0c6f594eaff0d6977b84b4103688b4aff0ad1aa16008a8cc854a7fb  .cert/stimulus_assets/rtmdet_tiny.pth" | sha256sum --check
          echo "77ffc7e802acf10951c353e8bc68b4f05218121177ceaea163aa124436ba6fb7  .cert/stimulus_assets/rtmpose_tiny.pth" | sha256sum --check

      - name: Build deterministic representative-like input
        run: |
          set -euo pipefail
          python scripts/build_e8_cert_stimulus.py \
            --image .cert/stimulus_assets/person.jpg \
            --det-config "$(cat .cert/det_config.txt)" \
            --det-checkpoint .cert/stimulus_assets/rtmdet_tiny.pth \
            --pose-config "$(cat .cert/pose_config.txt)" \
            --pose-checkpoint .cert/stimulus_assets/rtmpose_tiny.pth \
            --frames-dir .cert/frames \
            --metadata .cert/stimulus.json \
            --fps 10 --frames 40 --frequency-hz 1.0 --peak-shift-px 6.0
          ffmpeg -hide_banner -loglevel error -framerate 10 -i .cert/frames/%03d.png \
            -vf "pad=ceil(iw/2)*2:ceil(ih/2)*2" -c:v libx264 -pix_fmt yuv420p -movflags +faststart \
            .cert/e12_input.mp4

      - name: Run E12 with no explicit model or config paths
        run: |
          set -o pipefail
          test ! -e .cert/runtime
          python scripts/run_real_video_e12.py \
            --video .cert/e12_input.mp4 \
            --runtime-dir .cert/runtime \
            --output-dir .cert/e12-output \
            2>&1 | tee .cert/e12_runner.log

      - name: Assert self-bootstrap and acceptance evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          runtime = json.loads(Path('.cert/runtime/e12_runtime_manifest.json').read_text())
          run = json.loads(Path('.cert/e12-output/e12_run_manifest.json').read_text())
          acceptance = json.loads(Path('.cert/e12-output/e12_real_video_acceptance.json').read_text())

          expected = {
              'detector': '78e30dcce0c6f594eaff0d6977b84b4103688b4aff0ad1aa16008a8cc854a7fb',
              'pose': '77ffc7e802acf10951c353e8bc68b4f05218121177ceaea163aa124436ba6fb7',
              'mask': 'ec670f7ee9e20bd7931e15f15b7016f7fe531baaab81f2e6153382d046111885',
              'face_task': '64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff',
              'hand_task': 'fbc2a30080c3c557093b5ddfc334698132eb341044ccee322ccf8bcf3607cde1',
          }
          assert runtime['status'] == 'verified', runtime
          for name, sha in expected.items():
              assert runtime['assets'][name]['sha256'] == sha, (name, runtime['assets'][name])
              assert Path(runtime['assets'][name]['path']).is_file(), name

          assert run['status'] == 'completed', run
          assert run['machine_gate'] in {'passed', 'needs_review'}, run['machine_gate']
          assert run['final_acceptance'] == 'manual_frame_to_evidence_review_required'
          assert acceptance['final_acceptance'] == 'manual_frame_to_evidence_review_required'
          assert not Path('.cert/e12-output/e12_failure_report.json').exists()
          for name in ('blueprint.json', 'validation_report.json', 'bundle.zip', 'e12_real_video_acceptance.json'):
              path = Path('.cert/e12-output') / name
              assert path.is_file() and path.stat().st_size > 0, name
          print(json.dumps({
              'machine_gate': run['machine_gate'],
              'final_acceptance': run['final_acceptance'],
              'runtime_assets': sorted(runtime['assets']),
          }, indent=2))
          PY

      - name: Show E12 certification evidence
        if: always()
        run: |
          cat .cert/stimulus.json || true
          cat .cert/runtime/e12_runtime_manifest.json || true
          cat .cert/e12-output/e12_run_manifest.json || true
          cat .cert/e12-output/e12_failure_report.json || true
          cat .cert/e12-output/e12_real_video_acceptance.json || true

      - name: Upload E12 certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e12-self-bootstrapping-runner-certification
          path: |
            .cert/stimulus.json
            .cert/e12_runner.log
            .cert/runtime/e12_runtime_manifest.json
            .cert/e12-output/e12_run_manifest.json
            .cert/e12-output/e12_failure_report.json
            .cert/e12-output/e12_real_video_acceptance.json
            .cert/e12-output/validation_report.json
            .cert/e12-output/bundle.zip
          if-no-files-found: warn
