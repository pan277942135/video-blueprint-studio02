version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video_blueprint_api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=development
    volumes:
      - ./contracts:/app/contracts
      - ./configs:/app/configs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
